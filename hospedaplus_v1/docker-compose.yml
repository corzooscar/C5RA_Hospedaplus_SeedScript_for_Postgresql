services:
  postgres:
    image: postgres:16-alpine
    container_name: hospedaplus-postgres
    environment:
      POSTGRES_DB: hospedaplus
      POSTGRES_USER: hospedaplus
      POSTGRES_PASSWORD: hospedaplus_dev
    ports:
      - "5437:5432"
    volumes:
      - hospedaplus_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospedaplus -d hospedaplus"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  hospedaplus_pgdata:
